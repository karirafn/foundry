# Foundry's own secret-scanner configuration for the Publisher's Diff gate (#788, ADR 0100).
#
# The Publisher always passes this file with --config, so a repository's .gitleaks.toml, .gitleaksignore or
# inline gitleaks:allow comment never applies: the agent could have written any of them. It extends gitleaks'
# default rules unchanged. Add a Foundry-wide rule or allowlist here, never per repository.
title = "Foundry diff gate"

[extend]
useDefault = true

# generic-api-key fires on any key/token/secret-named identifier assigned a high-entropy string. These entries pass
# only the shapes it has flagged in worker output that are not secrets (#901); provider rules are never allowlisted.

[[allowlists]]
description = "A versioned name such as app.recent-items.v1: letters-only dotted segments and a .vN suffix carry no randomness, so the value is a storage-key or schema name, not a credential."
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^[a-zA-Z_-]+(?:\.[a-zA-Z_-]+)*\.v[0-9]{1,3}$''']

# Tests is case-sensitive in the directory and .cs alternatives so that Contest/ and latest.ts are not test paths.
[[allowlists]]
description = "A UUID in a test file is a fixture (an id or idempotency key), not a credential; a UUID outside a test file still blocks, and provider rules such as heroku-api-key still apply."
targetRules = ["generic-api-key"]
regexTarget = "secret"
condition = "AND"
regexes = ['''^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$''']
paths = ['''(?:\.(?i:spec|test)\.[cm]?[jt]sx?$|(?:^|/)(?i:tests?)/|(?:^|/)[^/]*(?:[._-]|[a-z])Tests?/|Tests?\.cs$|_test\.(?:go|py)$)''']
