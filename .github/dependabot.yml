version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /src/foundry-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Angular publishes its framework packages with exact peer deps on each
      # other, so a single-package bump cannot resolve — they move as one PR.
      angular:
        patterns:
          - "@angular/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
