version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /src/foundry-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Angular publishes its framework packages with exact peer deps on each
      # other, so a single-package bump cannot resolve — they move as one PR.
      angular:
        patterns:
          - "@angular/*"
    ignore:
      # Angular 22 pins `typescript@">=6.0 <6.1"` on @angular/build and
      # @angular/compiler-cli, so a TypeScript major cannot resolve. Drop this
      # entry once `npm view @angular/build peerDependencies.typescript`
      # admits the next major.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # @angular/build 22.1.x declares `peerOptional vitest@"^4.0.8"`, so a
      # vitest major cannot resolve under `npm ci`. Drop this entry once
      # `npm view @angular/build peerDependencies.vitest` admits ^5.0.0 on a
      # stable release (widened in 22.2.0, prerelease at the time of writing).
      - dependency-name: vitest
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
