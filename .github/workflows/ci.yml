name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/foundry-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/foundry-web

      - name: Build frontend
        run: npx ng build
        working-directory: src/foundry-web

      - name: Test frontend
        run: npx ng test --watch=false
        working-directory: src/foundry-web
