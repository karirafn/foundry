name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            api:
              - 'src/**/*.cs'
              - 'src/**/*.csproj'
              - 'src/Foundry.WebApi/openapi/**'
              - 'tests/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - '*.sln'

      - name: Setup .NET
        if: github.event_name == 'push' || steps.changes.outputs.api == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: github.event_name == 'push' || steps.changes.outputs.api == 'true'
        run: dotnet restore

      - name: Build
        if: github.event_name == 'push' || steps.changes.outputs.api == 'true'
        run: dotnet build --no-restore

      - name: Verify OpenAPI document is up to date
        if: github.event_name == 'push' || steps.changes.outputs.api == 'true'
        run: git diff --exit-code -- src/Foundry.WebApi/openapi/v1.json

      - name: Test
        if: github.event_name == 'push' || steps.changes.outputs.api == 'true'
        run: dotnet test --no-build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            web:
              - 'src/foundry-web/**'
              - 'src/Foundry.WebApi/openapi/**'  # schema.ts is generated from v1.json

      - name: Setup Node
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/foundry-web/package-lock.json

      - name: Install dependencies
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        run: npm ci
        working-directory: src/foundry-web

      - name: Verify generated API types are up to date
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        run: |
          npm run generate:api
          git diff --exit-code -- src/app/api/schema.ts
        working-directory: src/foundry-web

      - name: Build
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        run: npx ng build
        working-directory: src/foundry-web

      - name: Test
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        run: npx ng test --watch=false
        working-directory: src/foundry-web

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            workers:
              - 'workers/**'

      - name: Install bats
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        # npm-registry pin is reproducible across runner-image updates; apt version pins are not
        run: sudo npm install -g bats@1.11.1

      - name: Run BATS suite
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: |
          # The full-entrypoint test runs entrypoint.sh on the host, which clones
          # into the container's hardcoded /workspace. Provision it writable so the
          # bare runner can exercise that path (in the worker image it is node-owned).
          sudo mkdir -p /workspace
          sudo chown "$(id -u):$(id -g)" /workspace
          bats workers/tests/entrypoint.bats

      - name: Build base image
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: docker build -f workers/Dockerfile.base -t foundry-claude-base:local workers/

      - name: Build worker image
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: docker build --build-arg INSTALL_DOCKER=true -t foundry-worker:ci workers/

      - name: Image contract check — verify iproute2/procps present, fuse-overlayfs absent, setuid only on newuidmap/newgidmap
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: |
          # AC1: iproute2 and procps must be present
          docker run --rm foundry-worker:ci bash -c 'dpkg -l iproute2 procps | grep -E "^ii\s+(iproute2|procps)" | wc -l | grep -q "^2$"' \
            || { echo "FAIL: iproute2 or procps not installed in foundry-worker:ci"; exit 1; }
          echo "PASS: iproute2 and procps are installed"

          # AC1: fuse-overlayfs must NOT be present
          docker run --rm foundry-worker:ci bash -c '! dpkg -l fuse-overlayfs 2>/dev/null | grep -q "^ii"' \
            || { echo "FAIL: fuse-overlayfs is installed in foundry-worker:ci (must not be)"; exit 1; }
          echo "PASS: fuse-overlayfs is absent"

          # AC1: only newuidmap and newgidmap may carry the setuid bit; assert both ARE present
          docker run --rm --user root foundry-worker:ci bash -c '
            set -euo pipefail
            found=$(find / -xdev -perm -4000 -type f 2>/dev/null)
            echo "Setuid binaries found:"
            echo "$found"
            # Assert newuidmap is setuid
            echo "$found" | grep -q "newuidmap" || { echo "FAIL: newuidmap does not have setuid bit"; exit 1; }
            # Assert newgidmap is setuid
            echo "$found" | grep -q "newgidmap" || { echo "FAIL: newgidmap does not have setuid bit"; exit 1; }
            # Assert no other binary is setuid
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              b="$(basename "$f")"
              [ "$b" = "newuidmap" ] || [ "$b" = "newgidmap" ] || { echo "FAIL: unexpected setuid binary: $f"; exit 1; }
            done <<< "$found"
            echo "PASS: only newuidmap and newgidmap carry the setuid bit"
          '

      - name: Runner userns safeguard — allow unprivileged user namespaces (Ubuntu 24.04 AppArmor restriction)
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: |
          # Ubuntu 24.04 runners set kernel.apparmor_restrict_unprivileged_userns=1 by default,
          # which blocks rootless Docker even with apparmor=unconfined on the outer container.
          # This step relaxes the restriction so start_rootless_dockerd can create user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # AC8: real nested-daemon smoke — exercises start_rootless_dockerd with the REAL dockerd-rootless.sh
      # and docker binaries (no stubs). Flags mirror RootlessDindRunSpec.cs exactly:
      #   src/Modules/Workers/Foundry.Modules.Workers/Features/ContainerSpec/RootlessDindRunSpec.cs
      # That file is the single source of truth for the ADR 0079 relaxed allowance set.
      - name: Smoke test — real rootless dockerd starts and nested docker run reaches published port
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: |
          docker volume create foundry-worker-docker-smoke

          docker run --rm \
            --user node \
            --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            --device /dev/net/tun \
            -v foundry-worker-docker-smoke:/home/node/.local/share/docker \
            foundry-worker:ci \
            bash -euo pipefail -c '
              set -euo pipefail

              echo "=== Extracting and calling start_rootless_dockerd ===" >&2

              # Source the real start_rootless_dockerd from the shipped entrypoint.
              # awk extracts the function body (closing } on its own line = standard style).
              # DOCKER_RETRY_COUNT/SLEEP give the daemon enough time to cold-start.
              #
              # Assumption: the awk range /^start_rootless_dockerd\(\)/,/^\}/ stops at the
              # first line beginning with } at column 1. entrypoint.sh's start_rootless_dockerd
              # must end with } on column 1 and must contain no nested top-level (column-1) }
              # line. Violating either condition truncates or over-captures the extracted function.
              export DOCKER_RETRY_COUNT=30
              export DOCKER_RETRY_SLEEP=1
              eval "$(awk '"'"'/^start_rootless_dockerd\(\)/,/^\}/'"'"' /entrypoint.sh)"
              start_rootless_dockerd

              echo "=== Asserting DOCKER_HOST is set ===" >&2
              [ -n "${DOCKER_HOST:-}" ] || { echo "FAIL: DOCKER_HOST was not exported by start_rootless_dockerd"; exit 1; }
              echo "DOCKER_HOST=${DOCKER_HOST}"

              echo "=== Asserting docker version succeeds ===" >&2
              docker version || { echo "FAIL: docker version failed — daemon did not come up properly"; exit 1; }

              echo "=== Running nested container with published port ===" >&2
              # busybox httpd serves HTTP on port 80; publish it on 18080 so we can
              # reach it from the worker. Pull cost is minimal (busybox ~5 MB).
              docker run -d --name smoke-httpd -p 18080:80 busybox sh -c "
                mkdir -p /www && echo OK > /www/index.html && httpd -f -p 80 -h /www
              "

              echo "=== Polling published port 18080 ===" >&2
              # curl is present in the worker image (installed in Dockerfile.base).
              ok=0
              for i in $(seq 1 15); do
                response="$(curl -sf http://127.0.0.1:18080/ 2>/dev/null || true)"
                if [ -n "$response" ]; then
                  echo "PASS: got response from nested container: ${response}"
                  ok=1
                  break
                fi
                echo "  attempt ${i}/15 — not ready yet, sleeping 1s" >&2
                sleep 1
              done
              [ "$ok" -eq 1 ] || { echo "FAIL: published port 18080 not reachable after 15 attempts"; docker logs smoke-httpd || true; exit 1; }
            '

      - name: Remove smoke data-root volume
        if: always() && (github.event_name == 'push' || steps.changes.outputs.workers == 'true')
        run: docker volume rm foundry-worker-docker-smoke || true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            docs:
              - 'docs/adr/**'
              - 'DOMAIN.md'
              - 'scripts/**'

      - name: Install bats
        if: github.event_name == 'push' || steps.changes.outputs.docs == 'true'
        # npm-registry pin is reproducible across runner-image updates; apt version pins are not
        run: sudo npm install -g bats@1.11.1

      - name: Run BATS suite
        if: github.event_name == 'push' || steps.changes.outputs.docs == 'true'
        run: bats scripts/tests/check-adr-numbering.bats

      - name: Check ADR numbering contract
        if: github.event_name == 'push' || steps.changes.outputs.docs == 'true'
        run: bash scripts/check-adr-numbering.sh

  login-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            login:
              - 'workers/Dockerfile.base'
              - 'workers/Dockerfile.login'
              - 'tests/Foundry.IntegrationTests/Modules/Workers/Login/**'
              - 'src/Modules/Workers/Foundry.Modules.Workers/Features/Login/**'
              - 'src/Modules/Workers/Foundry.Modules.Workers/Infrastructure/DockerWorkerOrchestrator.cs'

      - name: Setup .NET
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        run: dotnet restore

      - name: Build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        run: dotnet build --no-restore

      - name: Build base image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        run: docker build -f workers/Dockerfile.base -t foundry-claude-base:local workers/

      - name: Build login image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        run: docker build -f workers/Dockerfile.login -t foundry-claude-login:local workers/

      - name: Run login integration tests
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        run: dotnet test tests/Foundry.IntegrationTests --no-build --filter "FullyQualifiedName~Login.LoginFlowIntegrationTests"
