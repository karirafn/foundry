name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            api:
              - 'src/**/*.cs'
              - 'src/**/*.csproj'
              - 'src/Foundry.WebApi/openapi/**'
              - 'tests/**'
              - 'workers/**'  # the composed-host smoke test builds the role catalog from workers/
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - '*.sln'

      - name: Setup .NET
        if: github.event_name == 'push' || steps.changes.outputs.api == 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: github.event_name == 'push' || steps.changes.outputs.api == 'true'
        run: dotnet restore

      - name: Build
        if: github.event_name == 'push' || steps.changes.outputs.api == 'true'
        run: dotnet build --no-restore

      - name: Verify OpenAPI document is up to date
        if: github.event_name == 'push' || steps.changes.outputs.api == 'true'
        run: git diff --exit-code -- src/Foundry.WebApi/openapi/v1.json

      - name: Test
        if: github.event_name == 'push' || steps.changes.outputs.api == 'true'
        run: dotnet test --no-build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            web:
              - 'src/foundry-web/**'
              - 'src/Foundry.WebApi/openapi/**'  # schema.ts is generated from v1.json

      - name: Setup Node
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/foundry-web/package-lock.json

      - name: Install dependencies
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        run: npm ci
        working-directory: src/foundry-web

      - name: Verify generated API types are up to date
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        run: |
          npm run generate:api
          git diff --exit-code -- src/app/api/schema.ts
        working-directory: src/foundry-web

      - name: Build
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        run: npx ng build
        working-directory: src/foundry-web

      - name: Test
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        run: npx ng test --watch=false
        working-directory: src/foundry-web

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            workers:
              - 'workers/**'

      - name: Install bats
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        # npm-registry pin is reproducible across runner-image updates; apt version pins are not
        run: sudo npm install -g bats@1.11.1

      - name: Run BATS suite
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: bats workers/tests/entrypoint.bats

      - name: Build base image
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: docker build -f workers/Dockerfile.base -t foundry-claude-base:local workers/

      - name: Build worker image
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: docker build --build-arg INSTALL_DOCKER=true --build-arg INSTALL_DOTNET=true -t foundry-worker:ci workers/

      - name: Image contract check — Claude Code CLI matches workers/package.json
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: |
          expected=$(node -p "require('./workers/package.json').dependencies['@anthropic-ai/claude-code']")
          actual=$(docker run --rm foundry-worker:ci claude --version | awk '{print $1}')
          [ "$actual" = "$expected" ] \
            || { echo "FAIL: claude --version is '$actual', workers/package.json pins '$expected'"; exit 1; }
          echo "PASS: claude $actual matches workers/package.json"

          docker run --rm foundry-worker:ci bash -c '[ "$DISABLE_AUTOUPDATER" = "1" ] && [ "$CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC" = "1" ]' \
            || { echo "FAIL: DISABLE_AUTOUPDATER and CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC must both be 1"; exit 1; }
          echo "PASS: auto-updater and nonessential traffic disabled"

      - name: Image contract check — csharp-ls matches workers/.config/dotnet-tools.json, plugin baked, rq-cli absent
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: |
          expected=$(jq -er '.tools["csharp-ls"].version' workers/.config/dotnet-tools.json)
          # csharp-ls --version prints "csharp-ls, <version> (<commit>)"
          actual=$(docker run --rm foundry-worker:ci csharp-ls --version | awk -F'[ ,]+' 'NR==1 {print $2}')
          [ "$actual" = "$expected" ] \
            || { echo "FAIL: csharp-ls --version is '$actual', workers/.config/dotnet-tools.json pins '$expected'"; exit 1; }
          echo "PASS: csharp-ls $actual matches workers/.config/dotnet-tools.json"

          docker run --rm foundry-worker:ci \
            jq -e '.name == "csharp-lsp" and .lspServers["csharp-ls"].command == "csharp-ls" and .lspServers["csharp-ls"].extensionToLanguage[".cs"] == "csharp"' \
            /opt/claude-plugins/csharp-lsp/.claude-plugin/plugin.json \
            || { echo "FAIL: baked csharp-lsp plugin.json must declare lspServers.csharp-ls"; exit 1; }
          echo "PASS: csharp-lsp plugin baked with lspServers.csharp-ls"

          docker run --rm foundry-worker:ci bash -c '[ ! -e /usr/local/bin/rq-cli ]' \
            || { echo "FAIL: rq-cli must not be installed in /usr/local/bin"; exit 1; }
          echo "PASS: rq-cli absent"

      - name: Image contract check — worker roles baked and read-only to node
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: |
          for role_file in \
            implement/.claude-plugin/plugin.json \
            implement/prompts/system.md \
            implement/prompts/task.md \
            shared/.claude-plugin/plugin.json; do
            docker run --rm foundry-worker:ci test -f "/opt/foundry/roles/$role_file" \
              || { echo "FAIL: /opt/foundry/roles/$role_file missing from the image"; exit 1; }
          done
          echo "PASS: implement and shared role files baked into /opt/foundry/roles"

          docker run --rm --user node foundry-worker:ci bash -c '! touch /opt/foundry/roles/probe 2>/dev/null && ! touch /opt/foundry/roles/implement/prompts/system.md 2>/dev/null' \
            || { echo "FAIL: /opt/foundry/roles must not be writable by node"; exit 1; }
          echo "PASS: /opt/foundry/roles not writable by node"

      - name: Image contract check — verify iproute2/procps present, fuse-overlayfs absent, setuid only on newuidmap/newgidmap
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: |
          # AC1: iproute2 and procps must be present
          docker run --rm foundry-worker:ci bash -c 'dpkg -l iproute2 procps | grep -E "^ii\s+(iproute2|procps)" | wc -l | grep -q "^2$"' \
            || { echo "FAIL: iproute2 or procps not installed in foundry-worker:ci"; exit 1; }
          echo "PASS: iproute2 and procps are installed"

          # AC1: fuse-overlayfs must NOT be present
          docker run --rm foundry-worker:ci bash -c '! dpkg -l fuse-overlayfs 2>/dev/null | grep -q "^ii"' \
            || { echo "FAIL: fuse-overlayfs is installed in foundry-worker:ci (must not be)"; exit 1; }
          echo "PASS: fuse-overlayfs is absent"

          # AC1: only newuidmap and newgidmap may carry the setuid bit; assert both ARE present
          docker run --rm --user root foundry-worker:ci bash -c '
            set -euo pipefail
            found=$(find / -xdev -perm -4000 -type f 2>/dev/null)
            echo "Setuid binaries found:"
            echo "$found"
            # Assert newuidmap is setuid
            echo "$found" | grep -q "newuidmap" || { echo "FAIL: newuidmap does not have setuid bit"; exit 1; }
            # Assert newgidmap is setuid
            echo "$found" | grep -q "newgidmap" || { echo "FAIL: newgidmap does not have setuid bit"; exit 1; }
            # Assert no other binary is setuid
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              b="$(basename "$f")"
              [ "$b" = "newuidmap" ] || [ "$b" = "newgidmap" ] || { echo "FAIL: unexpected setuid binary: $f"; exit 1; }
            done <<< "$found"
            echo "PASS: only newuidmap and newgidmap carry the setuid bit"
          '

      - name: Image contract check — managed settings are root-owned and immutable to node
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: |
          # Render with the shipped functions as root (the image's default user), then assert
          # ownership/modes and that the unprivileged node user cannot tamper with the file.
          docker run --rm -i \
            -e CLAUDE_SETTINGS_JSON='{"permissions":{"deny":["Bash(git push --force:*)"]},"model":"ci-model"}' \
            foundry-worker:ci bash -s <<'SCRIPT'
          set -euo pipefail
          [ "$(id -u)" = "0" ] || { echo "FAIL: the worker image does not start as root (uid $(id -u))"; exit 1; }
          for f in fail_bootstrap render_managed_settings; do
            src="$(sed -n "/^${f}()/,/^}/p" /entrypoint.sh)"
            [ -n "$src" ] || { echo "FAIL: could not extract $f from /entrypoint.sh"; exit 1; }
            eval "$src"
          done
          render_managed_settings /etc/claude-code/managed-settings.json

          dir_meta="$(stat -c '%U:%G %a' /etc/claude-code)"
          file_meta="$(stat -c '%U:%G %a' /etc/claude-code/managed-settings.json)"
          [ "$dir_meta" = "root:root 755" ] || { echo "FAIL: /etc/claude-code is '$dir_meta', expected 'root:root 755'"; exit 1; }
          [ "$file_meta" = "root:root 644" ] || { echo "FAIL: managed-settings.json is '$file_meta', expected 'root:root 644'"; exit 1; }
          echo "PASS: /etc/claude-code is root:root 0755 and managed-settings.json root:root 0644"

          as_node() { setpriv --reuid=node --regid=node --init-groups --inh-caps=-all bash -c "$1"; }
          as_node 'jq -e ".model == \"ci-model\"" /etc/claude-code/managed-settings.json > /dev/null' \
            || { echo "FAIL: node cannot read the rendered managed settings"; exit 1; }
          echo "PASS: node reads the rendered managed settings"
          if as_node 'echo "{}" > /etc/claude-code/managed-settings.json' 2> /dev/null; then echo "FAIL: node wrote managed-settings.json"; exit 1; fi
          if as_node 'chmod 666 /etc/claude-code/managed-settings.json' 2> /dev/null; then echo "FAIL: node chmodded managed-settings.json"; exit 1; fi
          if as_node 't="$(mktemp)"; echo "{}" > "$t"; mv -f "$t" /etc/claude-code/managed-settings.json' 2> /dev/null; then echo "FAIL: node replaced managed-settings.json"; exit 1; fi
          if as_node 'rm -f /etc/claude-code/managed-settings.json' 2> /dev/null; then echo "FAIL: node removed managed-settings.json"; exit 1; fi
          if as_node 'mkdir /etc/claude-code/managed-settings.d' 2> /dev/null; then echo "FAIL: node created managed-settings.d/"; exit 1; fi
          [ "$(stat -c '%U:%G %a' /etc/claude-code/managed-settings.json)" = "root:root 644" ] \
            && jq -e '.model == "ci-model"' /etc/claude-code/managed-settings.json > /dev/null \
            || { echo "FAIL: managed-settings.json changed after node tamper attempts"; exit 1; }
          echo "PASS: node cannot write, chmod, replace or remove managed-settings.json, nor create managed-settings.d/"
          SCRIPT

          # The real entrypoint renders as root, drops to node and passes the non-root
          # invariant check: with no auth configured it must stop at the auth check, not earlier.
          set +e
          out="$(docker run --rm -e CLAUDE_SETTINGS_JSON='{"model":"ci-model"}' foundry-worker:ci /entrypoint.sh 2>&1)"
          set -e
          echo "$out"
          echo "$out" | grep -q "Authentication required" \
            || { echo "FAIL: the entrypoint did not reach the non-root auth check after the root phase"; exit 1; }
          if echo "$out" | grep -q "FOUNDRY_BOOTSTRAP_FAILED"; then echo "FAIL: the root render/drop phase failed bootstrap"; exit 1; fi
          echo "PASS: entrypoint rendered, dropped to node and passed the managed-settings invariant"

          # A start that skips the root phase, or one without a generated policy, fails closed.
          set +e
          out="$(docker run --rm --user node foundry-worker:ci /entrypoint.sh 2>&1)"
          set -e
          echo "$out" | grep -q "FOUNDRY_BOOTSTRAP_FAILED stage=managed-settings" \
            || { echo "FAIL: a --user node start did not fail at stage=managed-settings: $out"; exit 1; }
          echo "PASS: a --user node start fails bootstrap at stage=managed-settings"
          set +e
          out="$(docker run --rm foundry-worker:ci /entrypoint.sh 2>&1)"
          set -e
          echo "$out" | grep -q "FOUNDRY_BOOTSTRAP_FAILED stage=managed-settings" \
            || { echo "FAIL: a start without CLAUDE_SETTINGS_JSON did not fail at stage=managed-settings: $out"; exit 1; }
          echo "PASS: a start without CLAUDE_SETTINGS_JSON fails bootstrap at stage=managed-settings"

      - name: Runner userns safeguard — allow unprivileged user namespaces (Ubuntu 24.04 AppArmor restriction)
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: |
          # Ubuntu 24.04 runners set kernel.apparmor_restrict_unprivileged_userns=1 by default,
          # which blocks rootless Docker even with apparmor=unconfined on the outer container.
          # This step relaxes the restriction so start_rootless_dockerd can create user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Real nested-daemon smoke — exercises start_rootless_dockerd with the REAL dockerd-rootless.sh
      # and docker binaries (no stubs). Flags mirror RootlessDindRunSpec.cs, except that
      # `--security-opt systempaths=unconfined` is the CLI-only alias of RootlessDindRunSpec.UnmaskSystemPaths,
      # which the orchestrator sends to the Engine API as empty MaskedPaths/ReadonlyPaths (the daemon rejects
      # the raw string):
      #   src/Modules/Workers/Foundry.Modules.Workers/Features/ContainerSpec/RootlessDindRunSpec.cs
      # That file is the single source of truth for the ADR 0079 relaxed allowance set.
      - name: Smoke test — real rootless dockerd starts and nested docker run reaches published port
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: |
          docker volume create foundry-worker-docker-smoke

          docker run --rm \
            --user node \
            --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            --device /dev/net/tun \
            -v foundry-worker-docker-smoke:/home/node/.local/share/docker \
            foundry-worker:ci \
            bash -euo pipefail -c '
              set -euo pipefail

              echo "=== Environment diagnostics ===" >&2
              id >&2
              echo "hostname=$(cat /proc/sys/kernel/hostname 2>/dev/null || echo unknown)" >&2
              head -n 1 /etc/os-release >&2 || true
              ls -la /entrypoint.sh >&2 || echo "DIAG: /entrypoint.sh is not present" >&2

              echo "=== Extracting and calling start_rootless_dockerd ===" >&2

              # Source the real start_rootless_dockerd from the shipped entrypoint.
              # sed extracts the function body: from the definition line to the first
              # line that is } at column 1 (the function closing brace; the shipped file
              # keeps all nested block braces indented). sed is used over awk so the
              # extraction stays deterministic regardless of the awk variant the image
              # ships. DOCKER_RETRY_COUNT/SLEEP give the daemon enough time to cold-start.
              export DOCKER_RETRY_COUNT=30
              export DOCKER_RETRY_SLEEP=1
              if [ ! -r /entrypoint.sh ]; then
                echo "FAIL: /entrypoint.sh is missing or unreadable inside the worker image" >&2
                exit 1
              fi
              func_src="$(sed -n '"'"'/^start_rootless_dockerd()/,/^}/p'"'"' /entrypoint.sh)"
              if [ -z "$func_src" ]; then
                echo "FAIL: could not extract start_rootless_dockerd from /entrypoint.sh" >&2
                exit 1
              fi
              eval "$func_src"
              start_rootless_dockerd

              echo "=== Asserting DOCKER_HOST is set ===" >&2
              [ -n "${DOCKER_HOST:-}" ] || { echo "FAIL: DOCKER_HOST was not exported by start_rootless_dockerd"; exit 1; }
              echo "DOCKER_HOST=${DOCKER_HOST}"

              echo "=== Asserting TESTCONTAINERS_HOST_OVERRIDE is set ===" >&2
              [ -n "${TESTCONTAINERS_HOST_OVERRIDE:-}" ] || { echo "FAIL: TESTCONTAINERS_HOST_OVERRIDE was not exported by start_rootless_dockerd"; exit 1; }
              echo "TESTCONTAINERS_HOST_OVERRIDE=${TESTCONTAINERS_HOST_OVERRIDE}"

              echo "=== Asserting docker version succeeds ===" >&2
              docker version || { echo "FAIL: docker version failed — daemon did not come up properly"; exit 1; }

              echo "=== Running nested container with published port ===" >&2
              # busybox httpd serves HTTP on port 80; publish it on 18080 so we can
              # reach it from the worker. Pull cost is minimal (busybox ~5 MB).
              docker run -d --name smoke-httpd -p 18080:80 busybox sh -c "
                mkdir -p /www && echo OK > /www/index.html && httpd -f -p 80 -h /www
              "

              echo "=== Polling published port 18080 ===" >&2
              # curl is present in the worker image (installed in Dockerfile.base).
              ok=0
              for i in $(seq 1 15); do
                response="$(curl -sf http://${TESTCONTAINERS_HOST_OVERRIDE}:18080/ 2>/dev/null || true)"
                if [ -n "$response" ]; then
                  echo "PASS: got response from nested container: ${response}"
                  ok=1
                  break
                fi
                echo "  attempt ${i}/15 — not ready yet, sleeping 1s" >&2
                sleep 1
              done
              [ "$ok" -eq 1 ] || { echo "FAIL: published port 18080 not reachable after 15 attempts"; docker logs smoke-httpd || true; exit 1; }
            '

      - name: Remove smoke data-root volume
        if: always() && (github.event_name == 'push' || steps.changes.outputs.workers == 'true')
        run: docker volume rm foundry-worker-docker-smoke || true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            docs:
              - 'docs/adr/**'
              - 'DOMAIN.md'
              - 'scripts/**'

      - name: Install bats
        if: github.event_name == 'push' || steps.changes.outputs.docs == 'true'
        # npm-registry pin is reproducible across runner-image updates; apt version pins are not
        run: sudo npm install -g bats@1.11.1

      - name: Run BATS suite
        if: github.event_name == 'push' || steps.changes.outputs.docs == 'true'
        run: bats scripts/tests/check-adr-numbering.bats

      - name: Check ADR numbering contract
        if: github.event_name == 'push' || steps.changes.outputs.docs == 'true'
        run: bash scripts/check-adr-numbering.sh

  login-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            login:
              - 'workers/Dockerfile.base'
              - 'workers/Dockerfile.login'
              - 'workers/package.json'
              - 'workers/package-lock.json'
              - 'tests/Foundry.IntegrationTests/Modules/Workers/Login/**'
              - 'src/Modules/Workers/Foundry.Modules.Workers/Features/Login/**'
              - 'src/Modules/Workers/Foundry.Modules.Workers/Infrastructure/DockerWorkerOrchestrator.cs'

      - name: Setup .NET
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        run: dotnet restore

      - name: Build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        run: dotnet build --no-restore

      - name: Build base image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        run: docker build -f workers/Dockerfile.base -t foundry-claude-base:local workers/

      - name: Build login image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        run: docker build -f workers/Dockerfile.login -t foundry-claude-login:local workers/

      - name: Run login integration tests
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        run: dotnet test tests/Foundry.IntegrationTests --no-build --filter "FullyQualifiedName~Login.LoginFlowIntegrationTests"
