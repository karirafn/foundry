name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            api:
              - 'src/**/*.cs'
              - 'src/**/*.csproj'
              - 'src/Foundry.WebApi/openapi/**'
              - 'tests/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - '*.sln'

      - name: Setup .NET
        if: github.event_name == 'push' || steps.changes.outputs.api == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: github.event_name == 'push' || steps.changes.outputs.api == 'true'
        run: dotnet restore

      - name: Build
        if: github.event_name == 'push' || steps.changes.outputs.api == 'true'
        run: dotnet build --no-restore

      - name: Verify OpenAPI document is up to date
        if: github.event_name == 'push' || steps.changes.outputs.api == 'true'
        run: git diff --exit-code -- src/Foundry.WebApi/openapi/v1.json

      - name: Test
        if: github.event_name == 'push' || steps.changes.outputs.api == 'true'
        run: dotnet test --no-build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            web:
              - 'src/foundry-web/**'
              - 'src/Foundry.WebApi/openapi/**'  # schema.ts is generated from v1.json

      - name: Setup Node
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/foundry-web/package-lock.json

      - name: Install dependencies
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        run: npm ci
        working-directory: src/foundry-web

      - name: Verify generated API types are up to date
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        run: |
          npm run generate:api
          git diff --exit-code -- src/app/api/schema.ts
        working-directory: src/foundry-web

      - name: Build
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        run: npx ng build
        working-directory: src/foundry-web

      - name: Test
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        run: npx ng test --watch=false
        working-directory: src/foundry-web

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            workers:
              - 'workers/**'

      - name: Install bats
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        # npm-registry pin is reproducible across runner-image updates; apt version pins are not
        run: sudo npm install -g bats@1.11.1

      - name: Run BATS suite
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: |
          # The full-entrypoint test runs entrypoint.sh on the host, which clones
          # into the container's hardcoded /workspace. Provision it writable so the
          # bare runner can exercise that path (in the worker image it is node-owned).
          sudo mkdir -p /workspace
          sudo chown "$(id -u):$(id -g)" /workspace
          bats workers/tests/entrypoint.bats

      - name: Build base image
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: docker build -f workers/Dockerfile.base -t foundry-claude-base:local workers/

      - name: Build worker image
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: docker build --build-arg INSTALL_DOCKER=true -t foundry-worker:ci workers/

      - name: Smoke test — start_rootless_dockerd creates XDG_RUNTIME_DIR as node user
        if: github.event_name == 'push' || steps.changes.outputs.workers == 'true'
        run: |
          docker run --rm \
            --user node \
            foundry-worker:ci \
            bash -euo pipefail -c '
              # Install stub dockerd-rootless.sh that stays alive long enough for the
              # readiness poll, then exits. The stub docker CLI always reports healthy
              # so the poll succeeds on the first attempt.
              mkdir -p /tmp/stub-bin

              cat > /tmp/stub-bin/dockerd-rootless.sh <<'"'"'STUB'"'"'
          #!/bin/bash
          sleep 30 &
          wait
          STUB
              chmod +x /tmp/stub-bin/dockerd-rootless.sh

              cat > /tmp/stub-bin/docker <<'"'"'STUB'"'"'
          #!/bin/bash
          exit 0
          STUB
              chmod +x /tmp/stub-bin/docker

              export PATH="/tmp/stub-bin:$PATH"
              export DOCKER_RETRY_COUNT=3
              export DOCKER_RETRY_SLEEP=0

              # Source the function and run it
              eval "$(awk '"'"'/^start_rootless_dockerd\(\)/,/^\}/'"'"' /entrypoint.sh)"
              start_rootless_dockerd

              # Assert XDG_RUNTIME_DIR was created, is writable, and has mode 700
              [ -d "$XDG_RUNTIME_DIR" ] || { echo "XDG_RUNTIME_DIR not created"; exit 1; }
              [ -w "$XDG_RUNTIME_DIR" ] || { echo "XDG_RUNTIME_DIR not writable"; exit 1; }
              mode="$(stat --format='%a' "$XDG_RUNTIME_DIR")"
              [ "$mode" = "700" ] || { echo "XDG_RUNTIME_DIR mode is $mode, expected 700"; exit 1; }
              echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR} — created, writable, mode 700"
            '

  login-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            login:
              - 'workers/Dockerfile.base'
              - 'workers/Dockerfile.login'
              - 'tests/Foundry.IntegrationTests/Modules/Workers/Login/**'
              - 'src/Modules/Workers/Foundry.Modules.Workers/Features/Login/**'
              - 'src/Modules/Workers/Foundry.Modules.Workers/Infrastructure/DockerWorkerOrchestrator.cs'

      - name: Setup .NET
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        run: dotnet restore

      - name: Build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        run: dotnet build --no-restore

      - name: Build base image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        run: docker build -f workers/Dockerfile.base -t foundry-claude-base:local workers/

      - name: Build login image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        run: docker build -f workers/Dockerfile.login -t foundry-claude-login:local workers/

      - name: Run login integration tests
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.login == 'true'
        run: dotnet test tests/Foundry.IntegrationTests --no-build --filter "FullyQualifiedName~Login.LoginFlowIntegrationTests"
