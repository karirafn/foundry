<div
  class="worker-card"
  [class.worker-card--done]="!live()"
  [class.worker-card--silent]="lastEvent()?.silent"
  [class.fd-board-moved]="item().moved"
>
  <div class="worker-card__meta" [id]="idBase() + '-meta'">
    <fd-role-tag [role]="role()" />
    <fd-issue-ref
      class="worker-card__ref"
      [slug]="item().issue.repositorySlug"
      [issueNumber]="item().issue.issueNumber"
    />
  </div>
  <button
    #button
    type="button"
    class="worker-card__title"
    aria-haspopup="dialog"
    [attr.aria-label]="label()"
    [attr.aria-describedby]="describedBy()"
    [attr.title]="item().issue.title"
    (click)="open.emit(button)"
  >
    {{ item().issue.title }}
  </button>
  @if (live()) {
    <fd-worker-activity [panel]="panel()" [taskLineId]="idBase() + '-task'" />
  }
  <div class="worker-card__footer">
    <p class="worker-card__status" [id]="idBase() + '-status'">
      @if (live()) {
        <span class="worker-card__elapsed"
          ><span class="sr-only">Running for </span><span aria-hidden="true">running </span
          >{{ elapsed() }}</span
        >
        @if (lastEvent(); as event) {
          <span class="worker-card__sep" aria-hidden="true">·</span><span class="sr-only">, </span>
          <span class="worker-card__event" [class.worker-card__event--silent]="event.silent">
            @if (event.silent) {
              <svg
                class="worker-card__warning"
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"
                />
                <path d="M12 9v4M12 17h.01" />
              </svg>
            }
            {{ event.text }}
          </span>
        }
      } @else {
        <span class="worker-card__completed">Completed</span>
      }
    </p>
    <a class="worker-card__floor" routerLink="/floor" [fragment]="laneFragment()">Watch on Floor</a>
  </div>
</div>
