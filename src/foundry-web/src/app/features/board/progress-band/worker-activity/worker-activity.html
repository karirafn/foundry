<div class="worker-activity" [class.worker-activity--starting]="panel().starting">
  <p class="worker-activity__task" [id]="taskLineId()">{{ panel().taskLine }}</p>
  @if (panel().taskBar; as bar) {
    <div class="worker-activity__steps">
      @switch (bar.shape.kind) {
        @case ('segments') {
          <span class="worker-activity__bar" aria-hidden="true">
            @for (segment of segments(); track $index) {
              <span
                class="worker-activity__segment"
                [class.worker-activity__segment--done]="segment.state === 'done'"
                [class.worker-activity__segment--current]="segment.state === 'current'"
                [class.worker-activity__segment--fill]="segment.fill"
              ></span>
            }
          </span>
        }
        @case ('meter') {
          <span class="worker-activity__meter" aria-hidden="true">
            <span
              class="worker-activity__meter-done"
              [style.width.%]="bar.shape.donePercent"
            ></span>
            @if (bar.shape.currentPercent > 0) {
              <span
                class="worker-activity__meter-current"
                [style.width.%]="bar.shape.currentPercent"
              ></span>
            }
          </span>
        }
      }
      <span class="worker-activity__progress">{{ bar.progress }}</span>
      <button
        type="button"
        class="worker-activity__toggle"
        [attr.aria-expanded]="expanded()"
        [attr.aria-controls]="listId()"
        (click)="toggle()"
      >
        Tasks
        <svg
          class="worker-activity__chevron"
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
    </div>
    <!-- Stays mounted while collapsed, so aria-controls always names an element. -->
    <fd-task-list
      class="worker-activity__list"
      [items]="panel().tasks"
      [listId]="listId()"
      [hidden]="!expanded()"
    />
  }
</div>
