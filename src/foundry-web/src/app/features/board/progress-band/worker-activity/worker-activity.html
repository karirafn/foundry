<div class="worker-activity" [class.worker-activity--starting]="panel().starting">
  <p class="worker-activity__task" [id]="taskLineId()">{{ panel().taskLine }}</p>
  @if (panel().segments.length > 0) {
    <div class="worker-activity__steps">
      <span class="worker-activity__bar" aria-hidden="true">
        @for (segment of panel().segments; track $index) {
          <span
            class="worker-activity__segment"
            [class.worker-activity__segment--done]="segment === 'done'"
            [class.worker-activity__segment--current]="segment === 'current'"
          ></span>
        }
      </span>
      <span class="worker-activity__progress">{{ panel().progress }}</span>
    </div>
  }
  <p class="worker-activity__tool" [attr.title]="panel().tool">{{ panel().tool }}</p>
</div>
