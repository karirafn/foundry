<div class="board-summary">
  @if (capacity(); as capacity) {
    <span class="board-summary__capacity">
      <span class="board-summary__pips" aria-hidden="true">
        @for (busy of pips(); track $index) {
          <span class="board-summary__pip" [class.board-summary__pip--busy]="busy"></span>
        }
      </span>
      <span class="board-summary__strong">{{ capacity.occupiedSlots }} of {{ capacity.maxConcurrent }} slots busy</span>
    </span>
  } @else if (capacityError()) {
    <span class="board-summary__muted">Capacity unavailable</span>
  }

  <span class="board-summary__waiting">{{ waitingCount() }} waiting</span>

  @if (needsCount() > 0) {
    <button type="button" class="board-summary__needs" (click)="needsYou.emit()">{{ needsText() }}</button>
  } @else {
    <span class="board-summary__nothing">Nothing needs you</span>
  }

  <fd-dispatch-controls />
  <fd-connection-indicator [status]="connectionStatus()" />
  <a class="board-summary__history" routerLink="/issues">Resolved history</a>
</div>
