<fd-board-band bandId="needs" label="Needs you" [tinted]="true">
  <span bandCount class="needs-band__count" aria-hidden="true">{{ count() }}</span><span
    bandCount
    class="sr-only"
    >{{ countText() }}</span
  >

  @if (alerts().length > 0) {
    <ul class="needs-band__alerts" aria-label="Repository alerts">
      @for (alert of alerts(); track alert.repositoryId) {
        <li><fd-repo-alert [alert]="alert" /></li>
      }
    </ul>
  }
  @if (items().length > 0) {
    <ul class="needs-band__rows" aria-label="Issues that need you">
      @for (item of items(); track item.issue.id) {
        <li class="needs-band__item" [class.fd-board-collapse]="item.phase === 'collapse'">
          <fd-lifecycle-row
            [item]="item"
            [now]="now()"
            (open)="open.emit({ id: item.issue.id, invoker: $event })"
          >
            @if (item.phase === 'live') {
              <fd-row-action
                rowAction
                [item]="item"
                (open)="open.emit({ id: item.issue.id, invoker: $event })"
              />
            }
          </fd-lifecycle-row>
        </li>
      }
    </ul>
  }
</fd-board-band>
