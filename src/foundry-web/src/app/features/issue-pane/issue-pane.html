<fd-pane-header
  [issue]="heading()"
  [titleId]="titleId"
  [pullRequestUrl]="pullRequestUrl()"
  (closed)="closed.emit()"
/>

<!-- A one-item loop keyed by the issue id, so the body remounts and replays its enter animation when the
     pane swaps to another issue. The key is a field of a wrapper object rather than the item itself:
     an identity key over a freshly built array makes Angular warn (NG0956) on every swap. -->
@for (pane of [{ id: issueId() }]; track pane.id) {
  <div class="issue-pane__body" animate.enter="issue-pane__body--enter">
    @if (untracked()) {
      <p class="issue-pane__untracked">This issue is no longer tracked.</p>
    } @else {
      <fd-pane-status
        [detail]="detail()"
        [run]="run()"
        [summary]="liveSummary()"
        [queuePosition]="queuePosition()"
        [error]="issueService.detailError()"
        (retry)="retry()"
      />
      @if (issueService.detailError() === null) {
        <fd-pane-clarifications [detail]="detail()" [providerType]="liveSummary()?.providerType ?? ''" />
        <fd-pane-review [reviewRunId]="detail()?.stateDetails?.reviewRunId ?? null" [run]="run()" />
        <fd-pane-facts [detail]="detail()" [run]="run()" [summary]="liveSummary()" />
      }
      @if (showsActivity()) {
        <fd-pane-activity [issueId]="issueId()" [workerRunId]="detail()?.stateDetails?.workerRunId ?? null" />
      }
    }
  </div>
}
