<fd-pane-header
  [issue]="heading()"
  [titleId]="titleId"
  [pullRequestUrl]="pullRequestUrl()"
  (closed)="closed.emit()"
/>

@for (id of [issueId()]; track id) {
  <div class="issue-pane__body" animate.enter="issue-pane__body--enter">
    @if (untracked()) {
      <p class="issue-pane__untracked">This issue is no longer tracked.</p>
    } @else {
      <fd-pane-status
        [detail]="detail()"
        [run]="run()"
        [summary]="liveSummary()"
        [queuePosition]="queuePosition()"
        [error]="issueService.detailError()"
        (retry)="retry()"
      />
      <!-- The Clarifications section (#757) slots in here, between the status and the facts. -->
      @if (issueService.detailError() === null) {
        <fd-pane-facts [detail]="detail()" [run]="run()" [summary]="liveSummary()" />
      }
      @if (showsActivity()) {
        <fd-pane-activity [issueId]="issueId()" [workerRunId]="detail()?.stateDetails?.workerRunId ?? null" />
      }
    }
  </div>
}
