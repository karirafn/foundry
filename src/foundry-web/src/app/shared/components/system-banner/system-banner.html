@if (activeNotifications().length > 0) {
  <div class="system-banner" role="region" aria-label="System notifications" tabindex="0">
    @for (notification of activeNotifications(); track notification.category) {
      <div class="system-banner__bar" role="alert">
        <svg
          class="system-banner__icon"
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span class="system-banner__message">{{ notification.message }}</span>
      </div>
    }
  </div>
}

<div
  class="system-banner system-banner--dispatch-only"
  role="region"
  aria-label="Dispatch status"
  [hidden]="!isDispatchBannerVisible()"
>
  <div class="system-banner__bar system-banner__bar--dispatch">
    <span class="system-banner__message" role="alert">
      {{ countdownText() !== null ? 'Usage limit active' : 'Dispatch is paused' }}
    </span>
    @if (countdownText() !== null) {
      <span class="system-banner__countdown">
        &mdash; resets in {{ countdownText() }}
      </span>
    }
    <button
      type="button"
      class="system-banner__action-btn"
      [disabled]="isResuming()"
      (click)="resumeDispatch()"
    >
      {{ isResuming() ? 'Resuming...' : 'Resume All' }}
    </button>
  </div>
</div>
