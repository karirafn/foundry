@if (activeNotifications().length > 0) {
  <div class="system-banner" role="region" aria-label="System notifications" tabindex="0">
    @for (notification of activeNotifications(); track notification.category) {
      <div class="system-banner__bar" role="alert">
        <svg
          class="system-banner__icon"
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span class="system-banner__message">{{ notification.message }}</span>
      </div>
    }
  </div>
}
